<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Red Solidaria - Editar Cuenta</title>
        <link rel="stylesheet" href="css/css.css"> <!-- Ajusta la ruta según tu estructura -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    </head>
    <body>
        <header class="header">
            <!-- Incluye tu header existente aquí si lo necesitas, o déjalo vacío para este ejemplo -->
            <div class="header-left">
                <a href="index.html" class="logo-link">
                    <img src="img/logo2.jpg" alt="Red Solidaria" class="logo">
                    <h1 class="brand-name">RED SOLIDARIA</h1>
                </a>
            </div>
            <div class="header-center">
                <input type="text" class="search-bar buscar" placeholder="Buscar...">
            </div>
            <div class="header-right">
                <button class="icon-btn" id="settings-btn">
                    <i class="fas fa-cog"></i>
                </button>
                <button class="icon-btn" onclick="openModal('notificationsModal')">
                    <i class="fas fa-bell"></i>
                </button>
                <button class="icon-btn" onclick="openModal('userModal')">
                    <i class="fas fa-user"></i>
                </button>
                <span class="username">Usuario</span>
            </div>
        </header>

        <main class="account-main">
            <h1>MI CUENTA</h1>
                <div class="privacy-toggle">
                    <span>Público <input type="radio" name="privacy" id="public" checked></span>
                    <span>Privado <input type="radio" name="privacy" id="private"></span>
                </div>               
                <div class="profile-photo">
                    <div class="photo-circle"></div>
                    <div class="photo-actions">
                        <button class="action-btn">Quitar la foto</button>
                        <button class="action-btn">Cambiar la foto</button>
                    </div>
                </div>
            <div class="info-section">
                    <label>Nombre</label>
                    <input type="text" value="usuario" readonly>
                    
                    <label>Correo electrónico</label>
                    <input type="email" value="correo" readonly>
          
                    <label>Contraseña</label>
                    <input type="password" value="contraseña">
                
                    <label>Ubicación</label>
                 
                        <select>
                            <option value="">Selecciona un país</option>
                        </select>
                        <select>
                            <option value="">Selecciona un estado</option>
                        </select>
                    
                    <button class="edit-btn">Editar</button>
                </div>
        </main>

        <footer>
            <p>Copyright 2025 | Privacidad | Condiciones de uso</p>
        </footer>

        <script src="js/modal.js" type="text/javascript"></script>
    </body>
</html>
